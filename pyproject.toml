[project]
name = "houdini-earth"
version = "0.1.0"
description = "Generate real-world meshes in SideFX Houdini using the Google Map Tiles API."
authors = [
    { name = "Beat Reichenbach" }
]
requires-python = ">=3.11, <3.12"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "dracopy",
    "pygltflib",
    "requests",
]

[project.optional-dependencies]
dev = [
    "numpy>=1.26", # Houdini ships numpy
    "pre-commit>=4.0",
    "python-semantic-release>=9.0",
    "pytest>=8.0",
    "ruff>=0.16",
    "ty>=0.0.82",
    "types-houdini>=21.0",
    "types-requests",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["earth*"]

[tool.setuptools.package-data]
earth = ["py.typed"]

[tool.semantic_release]
allow_zero_version = true
version_variables = ["earth/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version"]
build_command = "bash scripts/build_release.sh"

[tool.semantic_release.remote]
ignore_token_for_push = true

[tool.semantic_release.publish]
upload_to_vcs_release = true

[tool.ruff]
target-version = "py311"

[tool.ruff.format]
quote-style = 'single'
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["SIM108"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_level = "INFO"
