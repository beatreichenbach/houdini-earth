name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ZIP file
        run: |
          mkdir -p build/earth/python
          cp src/*.hda build/earth/
          cp src/*.json build/
          cp -r earth build/earth/python/earth
          find build -name __pycache__ -type d -prune -exec rm -rf {} +
          cd build
          zip -r ../earth-${{ github.ref_name }}.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: earth-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
